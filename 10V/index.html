<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WISE VIRGINS</title>
<style>
:root{--g:#39ff14;--d:#0b3d05;--bg:#000;--r:#ff3b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font:15px/1.5 "Courier New",ui-monospace,monospace;min-height:100vh}
#mx{position:fixed;inset:0;z-index:-1;opacity:.18}
main{max-width:860px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:clamp(2rem,9vw,4rem);margin:.2em 0 0;text-shadow:0 0 12px var(--g);letter-spacing:.08em}
.sub{font-size:1.2rem;margin:0}.dim{opacity:.7}
.box{border:1px solid var(--g);box-shadow:0 0 10px #39ff1440,inset 0 0 10px #39ff1410;padding:14px;margin:16px 0;background:#020a02cc}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 220px}
.big{font-size:2rem;text-shadow:0 0 8px var(--g)}
button{background:transparent;color:var(--g);border:1px solid var(--g);padding:10px 16px;font:inherit;cursor:pointer;box-shadow:0 0 8px #39ff1450}
button:hover{background:var(--g);color:#000;box-shadow:0 0 18px var(--g)}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea{width:100%;background:#000;color:var(--g);border:1px solid var(--d);padding:8px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--g)}
#pay{font-size:1.2rem;padding:14px 32px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
#chat{height:220px;overflow:auto;border:1px solid var(--d);padding:8px;margin-bottom:8px;word-break:break-word}
.bot{color:#9dff8a}.err{color:var(--r)}
dialog{background:#020a02;color:var(--g);border:1px solid var(--g);box-shadow:0 0 30px var(--g);max-width:640px;width:94%;padding:18px}
dialog::backdrop{background:#000c}
.pk{display:block;width:100%;text-align:left;margin:8px 0}
#term{white-space:pre-wrap;min-height:60px}
.bar{height:10px;border:1px solid var(--g);margin-top:6px}.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .4s}
a{color:var(--g)}
</style></head><body>
<canvas id="mx"></canvas>
<main>
<div class="dim">root@wise-virgins:~$ <span class="dot"></span> SYSTEM ONLINE</div>
<h1>WISE VIRGINS</h1>
<p class="sub">DO NOT MISS OUT.</p>
<p class="dim">Pay and upload your message to your snippet.</p>

<div class="box row">
  <div><div class="dim">DATE (EAT)</div><div id="date"></div><div class="big" id="clock">--:--:--</div></div>
  <div><div class="dim">NEXT 01:00 EAT RELEASE IN</div><div class="big" id="cd">--:--:--</div></div>
</div>

<div class="box" id="flow">
  <button id="pay">[ PAY ]</button>
  <div id="stage"></div>
</div>

<div class="box">
  <div class="dim">COMMUNITY CHAT</div>
  <div id="chat"></div>
  <div class="row"><input id="nm" maxlength="16" placeholder="username" style="flex:0 1 140px"><input id="tx" maxlength="300" placeholder="say something 😀"><button id="send" style="flex:0 0 auto">SEND</button></div>
</div>
</main>

<dialog id="dlg"><div class="dim">SELECT PACKAGE</div><div id="pks"></div><button id="close">CLOSE</button></dialog>

<script>
const $=id=>document.getElementById(id),api=(p,o)=>fetch(p,o).then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.status)}return r.json()});
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const pad=n=>String(n).padStart(2,'0');
// Nairobi is UTC+3 with no DST, so shifting UTC by 3h gives wall-clock EAT.
const eat=()=>new Date(Date.now()+3*3600e3);
function tick(){const n=eat();
 $('clock').textContent=`${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}`;
 $('date').textContent=n.toUTCString().slice(0,16);
 let t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),1);if(t<=n.getTime())t+=864e5;
 const s=Math.floor((t-n.getTime())/1e3);
 $('cd').textContent=`${pad(s/3600|0)}:${pad(s%3600/60|0)}:${pad(s%60)}`}
setInterval(tick,1000);tick();

// matrix rain (cheap, pauses when tab hidden)
const cv=$('mx'),cx=cv.getContext('2d');let cols,dr;
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/16);dr=Array(cols).fill(0)}
rs();addEventListener('resize',rs);
setInterval(()=>{if(document.hidden)return;cx.fillStyle='rgba(0,0,0,.08)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#39ff14';cx.font='14px monospace';
 dr.forEach((y,i)=>{cx.fillText(String.fromCharCode(0x30A0+Math.random()*60|0),i*16,y*16);dr[i]=y*16>cv.height&&Math.random()>.975?0:y+1})},70);

let cfg,st;
const stage=$('stage');
const line=(t,c)=>{const d=document.createElement('div');d.textContent=t;if(c)d.className=c;return d};
function say(...ls){stage.replaceChildren(...ls)}

async function refresh(){
 st=await api('/api/status');
 const p=st.payment;
 if(!p||p.status==='failed'||p.status==='mismatch'){
  $('pay').style.display='';
  say(...(p?[line(`[STATUS] last payment: ${p.status.toUpperCase()}. You can try again.`,'err')]:[]));
 }else if(p.status==='pending'){
  $('pay').style.display='none';
  const ls=[line('[STATUS] Waiting for M-Pesa confirmation... enter your PIN on the phone prompt.'),line('Checking automatically.','dim')];
  if(cfg.mode==='mock'){const b=document.createElement('button');b.textContent='[DEV] simulate successful payment';b.onclick=async()=>{await post('/api/mock/confirm');refresh()};ls.push(b)}
  say(...ls);setTimeout(refresh,4000);
 }else if(!st.snippet){
  $('pay').style.display='none';
  const ta=document.createElement('textarea');ta.rows=5;ta.maxLength=500;ta.placeholder='your message...';
  const cn=line('0/500','dim');ta.oninput=()=>cn.textContent=`${ta.value.length}/500`;
  const b=document.createElement('button');b.textContent='[ UPLOAD ]';
  b.onclick=async()=>{b.disabled=true;try{await post('/api/snippet',{message:ta.value});await run()}catch(e){say(line('[ERROR] '+e.message,'err'),b);b.disabled=false}};
  say(line(`[PAYMENT VERIFIED] receipt ${p.receipt}`),line('UPLOAD YOUR MESSAGE TO YOUR SNIPPET'),ta,cn,b);
 }else{done()}
}
// Real steps only: each line reflects something that actually happened.
async function run(){
 const steps=['Message received and saved.','Payment record linked to snippet.','Access link generated.'];
 for(const s of steps){stage.append(line('> '+s));await new Promise(r=>setTimeout(r,500))}
 await refresh()}
function done(){
 $('pay').style.display='none';
 const a=document.createElement('a');a.href=st.link;a.target='_blank';a.rel='noopener';a.textContent='[ OPEN REPOSITORY ]';
 say(line('[COMPLETE] Your snippet is saved.'),line('Your repository link is ready now. No waiting needed.'),line(`Link terms are shown on your package: keep this page or bookmark the link.`,'dim'),a)}

$('pay').onclick=async()=>{
 cfg=cfg||await api('/api/config');
 $('pks').replaceChildren(...Object.entries(cfg.packages).map(([k,v])=>{
  const b=document.createElement('button');b.className='pk';
  b.textContent=`PACKAGE ${k} | ${v.name} | KSh ${v.price.toLocaleString()}\n${v.note}`;b.style.whiteSpace='pre-wrap';
  b.onclick=()=>choose(k,v);return b}));
 $('dlg').showModal()};
$('close').onclick=()=>$('dlg').close();

function choose(k,v){
 const ph=document.createElement('input');ph.placeholder='M-Pesa phone: 07XXXXXXXX';ph.inputMode='tel';
 const go=document.createElement('button');go.textContent='[ SEND PAYMENT PROMPT ]';
 const msg=line('');
 go.onclick=async()=>{go.disabled=true;try{await post('/api/pay',{package:k,phone:ph.value});$('dlg').close();refresh()}catch(e){msg.textContent='[ERROR] '+e.message;msg.className='err';go.disabled=false}};
 $('pks').replaceChildren(line('PAYMENT DESTINATION'),line(`M-PESA NUMBER: ${cfg.pay_number}`),
  line(`${v.name} | KSh ${v.price.toLocaleString()}`),
  line('You will receive an M-Pesa prompt on your phone. Access is granted only after the payment is confirmed by Safaricom; no code entry is needed.','dim'),ph,go,msg)}

// chat: poll every 6s, only while tab visible
let last=0;const ch=$('chat');$('nm').value=localStorage.nm||'';
async function poll(){if(document.hidden)return;try{
 const rows=await api('/api/chat?after='+last);
 for(const m of rows){last=Math.max(last,m.id);
  const d=document.createElement('div');if(m.bot)d.className='bot';
  const t=new Date(m.ts*1e3+3*3600e3);
  d.textContent=`[${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}] ${m.name}: ${m.text}`;ch.append(d)}
 if(rows.length)ch.scrollTop=ch.scrollHeight}catch(e){}}
setInterval(poll,6000);poll();
async function send(){const text=$('tx').value.trim();if(!text)return;localStorage.nm=$('nm').value;
 try{await post('/api/chat',{name:$('nm').value||'anon',text});$('tx').value='';poll()}catch(e){ch.append(line('[ERROR] '+e.message,'err'))}}
$('send').onclick=send;$('tx').onkeydown=e=>{if(e.key==='Enter')send()};

api('/api/config').then(c=>{cfg=c;refresh()});
</script></body></html>
